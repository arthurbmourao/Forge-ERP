spring:
  application:
    name: forge-erp

  datasource:
    url: jdbc:postgresql://localhost:5433/forge
    username: forge
    password: forge
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # emissor do Keycloak (realm "forge"); sobrescreva com a variavel KEYCLOAK_ISSUER_URI
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/forge}

server:
  port: 8080